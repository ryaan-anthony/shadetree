name: Spec work
description: Work that delivers a spec in docs/specs. Most spec issues are generated by script/plan/sync_issues; use this when one is missing.
labels: [spec]
body:
  - type: input
    id: spec
    attributes:
      label: Spec
      description: ID and path of the spec this delivers.
      placeholder: "QTE-01 · docs/specs/quotes/QTE-01-quote-builder.md"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences, from the spec.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Copy the checklist from the spec.
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Blocked by
      description: Issues that must close first. Add them as "blocked by" relationships too.
      placeholder: "#57, #58"
