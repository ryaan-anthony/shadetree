name: Chore / tech debt
description: Maintenance work that doesn't change user-visible behavior.
labels: [chore]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does this solve, and what happens if we don't do it?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable outcomes, as a checklist.
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [platform, accounts, catalog, clients, quotes, jobs, payments, notifications, billing, operator, marketing, insights]
