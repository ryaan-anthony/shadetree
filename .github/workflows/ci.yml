name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    # Weekly run on main catches newly disclosed vulnerabilities in unchanged code.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest: images change underneath us,
# and ubuntu-26.04 has no prebuilt Ruby 3.4.5, which broke every job. Bump deliberately.
jobs:
  plan:
    name: Plan docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Validate specs, dependencies and links
        run: ruby script/plan/lint

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: RuboCop
        run: bin/rubocop -f github
      - name: Ruby version has one source of truth
        run: |
          want="$(cat .ruby-version)"
          grep -q "^ARG RUBY_VERSION=${want}$" Dockerfile || { echo "::error file=Dockerfile::RUBY_VERSION must match .ruby-version (${want})"; exit 1; }

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Static analysis (Brakeman)
        run: bin/brakeman --no-pager
      - name: Ruby dependency audit (bundler-audit)
        run: bin/bundler-audit check --update
      - name: JavaScript dependency audit (importmap)
        run: bin/importmap audit

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shadetree_test
    steps:
      - uses: actions/checkout@v7
      # libvips from cached packages (script/ci/install-libvips), keyed by Ubuntu release and
      # week; a run that had to download saves what it got under a new key, and the newest of
      # the week is restored.
      - name: libvips cache key
        id: image
        # The Ubuntu release (the packages are built for it, whatever the runner image) and the
        # ISO week, so the cache refreshes weekly and picks up security updates.
        run: echo "version=$(. /etc/os-release && echo "$VERSION_CODENAME")-$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore libvips packages
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/debs
          key: libvips-debs-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ github.run_id }}-${{ github.job }}
          restore-keys: libvips-debs-${{ runner.os }}-${{ steps.image.outputs.version }}-
      - name: Install libvips (image processing, ADR 0008)
        id: libvips
        run: script/ci/install-libvips
      - name: Save libvips packages
        if: steps.libvips.outputs.refreshed == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/debs
          key: libvips-debs-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ github.run_id }}-${{ github.job }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build CSS
        run: bin/rails tailwindcss:build
      - name: Prepare database
        run: bin/rails db:test:prepare
      - name: Unit and integration tests
        env:
          COVERAGE: "false"
        run: |
          pass=0; fail=0
          for i in $(seq 1 1); do
            if bin/rails test > run.log 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); echo "=== RUN $i FAILED"; grep -B2 -A12 -E "^(Failure|Error):" run.log; fi
            grep -E "seed|runs,|DIAG-" run.log
          done
          echo "SUMMARY pass=$pass fail=$fail"
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/.last_run.json ]; then
            ruby -rjson -e '
              r = JSON.parse(File.read("coverage/.last_run.json"))["result"]
              puts "### Test coverage", "", "| Lines | Branches |", "| --- | --- |", "| #{r["line"]}% | #{r["branch"] || "n/a"}% |"
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

  system:
    name: System tests
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shadetree_test
      COVERAGE: "false"
    steps:
      - uses: actions/checkout@v7
      # libvips from cached packages (script/ci/install-libvips), keyed by Ubuntu release and
      # week; a run that had to download saves what it got under a new key, and the newest of
      # the week is restored.
      - name: libvips cache key
        id: image
        # The Ubuntu release (the packages are built for it, whatever the runner image) and the
        # ISO week, so the cache refreshes weekly and picks up security updates.
        run: echo "version=$(. /etc/os-release && echo "$VERSION_CODENAME")-$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore libvips packages
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/debs
          key: libvips-debs-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ github.run_id }}-${{ github.job }}
          restore-keys: libvips-debs-${{ runner.os }}-${{ steps.image.outputs.version }}-
      - name: Install libvips (image processing, ADR 0008)
        id: libvips
        run: script/ci/install-libvips
      - name: Save libvips packages
        if: steps.libvips.outputs.refreshed == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/debs
          key: libvips-debs-${{ runner.os }}-${{ steps.image.outputs.version }}-${{ github.run_id }}-${{ github.job }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build CSS
        run: bin/rails tailwindcss:build
      - name: Prepare database
        run: bin/rails db:test:prepare
      - name: System tests (headless Chrome)
        env:
          DIAG_SHOT: "1"
        run: |
          google-chrome --version; chromedriver --version || true
          pass=0; fail=0
          for i in $(seq 1 70); do
            if bin/rails test test/system/client_search_test.rb test/system/schedule_test.rb test/system/clients_test.rb > run.log 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); echo "=== RUN $i FAILED"; cat run.log; fi
            grep -E "seed|runs,|DIAG-" run.log
          done
          echo "SUMMARY pass=$pass fail=$fail"
      - name: Keep screenshots from failed system tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-screenshots
          path: tmp/screenshots
          if-no-files-found: ignore
          retention-days: 14
