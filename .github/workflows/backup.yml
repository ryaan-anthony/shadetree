# Off-site backups and an automatic restore drill (PLT-09, docs/runbooks/operations.md).
#  - Nightly: dump the production primary database and copy uploaded files to the backup bucket.
#    The managed database's own daily snapshots and point-in-time recovery stay on as well.
#  - Weekly: restore the latest dump into a throwaway PostgreSQL and check it, so we know
#    backups actually restore.
# Retention is a lifecycle rule on the backup bucket (30 daily dumps, 12 monthly).
name: Backup

on:
  schedule:
    - cron: "23 7 * * *"   # nightly, 02:23 New York
    - cron: "41 8 * * 0"   # Sunday restore drill
  workflow_dispatch:
    inputs:
      drill:
        description: Run the restore drill instead of a backup
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backup:
    name: Back up production
    if: vars.BACKUP_BUCKET != '' && !(github.event_name == 'schedule' && github.event.schedule == '41 8 * * 0') && !inputs.drill
    runs-on: ubuntu-24.04
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: ${{ vars.BACKUP_ENDPOINT }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" > "primary-$stamp.dump"
          test -s "primary-$stamp.dump"
          aws s3 cp "primary-$stamp.dump" "s3://$BACKUP_BUCKET/db/primary-$stamp.dump"
      - name: Copy uploaded files
        env:
          SOURCE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
          SOURCE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
          SOURCE_BUCKET: ${{ vars.STORAGE_BUCKET }}
        run: |
          mkdir files
          AWS_ACCESS_KEY_ID=$SOURCE_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$SOURCE_SECRET_ACCESS_KEY \
            aws s3 sync "s3://$SOURCE_BUCKET" files --only-show-errors
          aws s3 sync files "s3://$BACKUP_BUCKET/files" --only-show-errors

  restore-drill:
    name: Restore drill
    if: vars.BACKUP_BUCKET != '' && ((github.event_name == 'schedule' && github.event.schedule == '41 8 * * 0') || inputs.drill)
    runs-on: ubuntu-24.04
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: ${{ vars.BACKUP_ENDPOINT }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Restore the latest dump into a scratch database
        env:
          PGPASSWORD: postgres
        run: |
          latest=$(aws s3 ls "s3://$BACKUP_BUCKET/db/" | sort | tail -1 | awk '{print $4}')
          test -n "$latest"
          echo "Restoring $latest" >> "$GITHUB_STEP_SUMMARY"
          aws s3 cp "s3://$BACKUP_BUCKET/db/$latest" latest.dump
          createdb -h localhost -U postgres shadetree_restore
          pg_restore -h localhost -U postgres --no-owner --dbname=shadetree_restore latest.dump
      - name: Check the restored data
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/shadetree_restore
          RAILS_ENV: test
        run: bin/rails runner script/ops/verify_restore.rb | tee -a "$GITHUB_STEP_SUMMARY"
