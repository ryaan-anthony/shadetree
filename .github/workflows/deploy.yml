# Deploys (PLT-09, docs/runbooks/operations.md).
#  - Staging: automatically, after CI passes on a push to main.
#  - Production: when a GitHub release is published, or by running this workflow by hand.
#    It promotes the image already built and tested on staging for that commit.
#  - Rollback: run by hand with "rollback_to" set to a previous release's commit SHA.
# Jobs skip themselves until the repository-level switches STAGING_READY / PRODUCTION_READY are
# "true" (job conditions can't see environment-scoped variables). See docs/runbooks/operations.md.
name: Deploy

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [ staging, production ]
        default: staging
      rollback_to:
        description: "Optional: roll back to this commit SHA (a previously deployed version)"
        type: string
        required: false

permissions:
  contents: read
  packages: write

jobs:
  staging:
    name: Staging
    if: >-
      vars.STAGING_READY == 'true' && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'))
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: https://${{ vars.STAGING_DOMAIN }}
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    env:
      KAMAL_REGISTRY_USERNAME: ${{ github.repository_owner }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      KAMAL_IMAGE: ${{ github.repository }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CACHE_DATABASE_URL: ${{ secrets.CACHE_DATABASE_URL }}
      QUEUE_DATABASE_URL: ${{ secrets.QUEUE_DATABASE_URL }}
      CABLE_DATABASE_URL: ${{ secrets.CABLE_DATABASE_URL }}
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
      STAGING_MAIL_ALLOWLIST: ${{ vars.STAGING_MAIL_ALLOWLIST }}
      STAGING_MAIL_SANDBOX_TO: ${{ vars.STAGING_MAIL_SANDBOX_TO }}
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: docker/setup-buildx-action@v3
      - name: Trust the host key
        run: mkdir -p ~/.ssh && echo "${{ vars.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
      - name: Deploy
        run: |
          if [ -n "${{ inputs.rollback_to }}" ]; then
            bin/kamal rollback "${{ inputs.rollback_to }}" -d staging
          else
            bin/kamal deploy -d staging
          fi

  production:
    name: Production
    if: >-
      vars.PRODUCTION_READY == 'true' && (
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'production'))
    runs-on: ubuntu-24.04
    environment:
      # Protect this environment with required reviewers in the repository settings.
      name: production
      url: https://${{ vars.PRODUCTION_DOMAIN }}
    concurrency: { group: deploy-production, cancel-in-progress: false }
    env:
      KAMAL_REGISTRY_USERNAME: ${{ github.repository_owner }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      KAMAL_IMAGE: ${{ github.repository }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CACHE_DATABASE_URL: ${{ secrets.CACHE_DATABASE_URL }}
      QUEUE_DATABASE_URL: ${{ secrets.QUEUE_DATABASE_URL }}
      CABLE_DATABASE_URL: ${{ secrets.CABLE_DATABASE_URL }}
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID }}
      STORAGE_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT }}
      STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      STAGING_HOST: ${{ vars.STAGING_HOST }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
      STAGING_MAIL_ALLOWLIST: ${{ vars.STAGING_MAIL_ALLOWLIST }}
      STAGING_MAIL_SANDBOX_TO: ${{ vars.STAGING_MAIL_SANDBOX_TO }}
      PRODUCTION_HOST: ${{ vars.PRODUCTION_HOST }}
      PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Trust the host key
        run: mkdir -p ~/.ssh && echo "${{ vars.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy or roll back
        run: |
          if [ -n "${{ inputs.rollback_to }}" ]; then
            bin/kamal rollback "${{ inputs.rollback_to }}" -d production
          else
            # Promote only the image staging built and ran for this commit. If it doesn't exist
            # (the commit never reached staging), fail rather than build an untested image.
            image="ghcr.io/${{ github.repository }}:${{ github.sha }}"
            docker manifest inspect "$image" > /dev/null || { echo "::error::$image was never deployed to staging"; exit 1; }
            bin/kamal deploy -d production --skip-push --version="${{ github.sha }}"
          fi
