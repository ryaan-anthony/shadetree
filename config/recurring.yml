#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  automations_due: # NTF-04: overdue invoices, and runs a restart dropped
    class: AutomationsDueJob
    schedule: every hour at minute 23
  prune_notifications: # NTF-02
    class: PruneNotificationsJob
    schedule: every day at 4:20am
  prune_contact_messages: # MKT-02
    class: PruneContactMessagesJob
    schedule: every day at 4:35am
  prune_client_imports: # CLI-06: abandoned uploads and old reports
    class: PruneClientImportsJob
    schedule: every day at 4:50am
  prune_data_exports: # INS-02: expired export zips
    class: PruneDataExportsJob
    schedule: every day at 5:05am
  delete_scheduled_businesses: # OPS-04: businesses whose deletion waiting period is over
    class: DeleteScheduledBusinessesJob
    schedule: every day at 3:40am
  resolve_stale_support_tickets: # OPS-05: "Waiting on you" tickets nobody answered
    class: ResolveStaleSupportTicketsJob
    schedule: every day at 5:20am
  purge_inbound_emails: # OPS-05: raw support email older than 14 days
    class: PurgeInboundEmailsJob
    schedule: every day at 5:35am
  visit_reminders: # JOB-05: the day-before reminders, as each business's clock reaches the hour
    class: VisitRemindersJob
    schedule: every hour at minute 7
  job_health_check: # PLT-10: failed jobs and a backlog raise an alert
    class: JobHealthCheckJob
    schedule: every 10 minutes
    priority: -10 # ahead of the backlog it reports on (lower runs first; jobs default to 0)
  process_stripe_events: # BIL-04: Stripe events whose processing didn't finish
    class: ProcessStripeEventsJob
    schedule: every 15 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
