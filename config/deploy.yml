# Kamal 2 (ADR 0009). Shared settings; per-environment values live in deploy.staging.yml and
# deploy.production.yml and come from the environment (GitHub environment variables in CI,
# your shell locally). Deploy with: bin/kamal deploy -d staging   (see docs/runbooks/operations.md)
service: shadetree
image: <%= ENV.fetch("KAMAL_IMAGE", "ryaan-anthony/shadetree") %>

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "ryaan-anthony") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    # Managed PostgreSQL: one server, four databases (ADR 0002)
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - QUEUE_DATABASE_URL
    - CABLE_DATABASE_URL
    # Object storage, S3-compatible (ADR 0008)
    - STORAGE_ACCESS_KEY_ID
    - STORAGE_SECRET_ACCESS_KEY
    # Outgoing mail over SMTP (ADR 0011)
    - SMTP_USERNAME
    - SMTP_PASSWORD
  clear:
    # Solid Queue runs inside Puma on a single host (ADR 0007), including recurring tasks.
    SOLID_QUEUE_IN_PUMA: true
    STORAGE_ENDPOINT: "<%= ENV.fetch("STORAGE_ENDPOINT", "") %>"
    STORAGE_BUCKET: "<%= ENV.fetch("STORAGE_BUCKET", "") %>"
    STORAGE_REGION: <%= ENV.fetch("STORAGE_REGION", "auto") %>
    SMTP_ADDRESS: <%= ENV.fetch("SMTP_ADDRESS", "smtp.postmarkapp.com") %>
    MAIL_FROM: <%= ENV.fetch("MAIL_FROM", "Shadetree <no-reply@getshadetree.com>") %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Local Active Storage files when no bucket is configured. With object storage (ADR 0008) this
# stays empty.
volumes:
  - "shadetree_storage:/rails/storage"

# Bridge fingerprinted assets between versions so in-flight requests don't 404.
asset_path: /rails/public/assets

builder:
  arch: amd64

# Keep the last few releases on the host so `kamal rollback` is instant.
retain_containers: 5
