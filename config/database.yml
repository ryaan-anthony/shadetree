# PostgreSQL everywhere (docs/adr/0002-postgresql.md).
#
# Development and test connect to a local server. Override with DATABASE_URL, or with
# PGHOST / PGUSER / PGPASSWORD, which libpq reads automatically.
#
# Production uses one managed server with four databases: the app's primary database
# plus one each for Solid Cache, Solid Queue and Solid Cable. Their URLs come from secrets.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: shadetree_development

# Warning: the test database is erased and regenerated by "bin/rails test".
test:
  <<: *default
  database: shadetree_test

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    url: <%= ENV["CABLE_DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
