<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ShadeTree</title>
    <meta name="description" content="Sign in to your ShadeTree account to manage your service business.">
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', sans-serif;
            line-height: 1.6;
            color: #2d3748;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* Login Container */
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }

        /* Header */
        .login-header {
            background: linear-gradient(135deg, #4299e1 0%, #3182ce 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .logo img {
            height: 32px;
            margin-right: 0.5rem;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .login-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        /* Form Content */
        .login-content {
            padding: 2rem;
        }

        /* Social Login Options */
        .social-buttons {
            display: grid;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            background-color: white;
            color: #4a5568;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .social-button:hover {
            border-color: #cbd5e0;
            background-color: #f8f9fa;
        }

        .social-button img {
            width: 20px;
            height: 20px;
            margin-right: 0.75rem;
        }

        /* Divider */
        .social-divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }

        .social-divider::before,
        .social-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #e2e8f0;
        }

        .social-divider span {
            padding: 0 1rem;
            color: #718096;
            font-size: 0.9rem;
        }

        /* Login Form */
        .login-form {
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.2s ease;
            background-color: #ffffff;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.1);
        }

        .form-group input.error {
            border-color: #e53e3e;
        }

        .error-message {
            color: #e53e3e;
            font-size: 0.8rem;
            margin-top: 0.25rem;
            display: none;
        }

        /* Remember Me and Forgot Password */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
        }

        .remember-me input {
            width: auto;
            margin-right: 0.5rem;
        }

        .forgot-password {
            color: #4299e1;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Submit Button */
        .submit-button {
            background-color: #48bb78;
            color: white;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 1.5rem;
        }

        .submit-button:hover:not(:disabled) {
            background-color: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
        }

        .submit-button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Register Link */
        .register-link {
            text-align: center;
            color: #718096;
            font-size: 0.9rem;
        }

        .register-link a {
            color: #4299e1;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Alert Messages */
        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .alert-error {
            background-color: #fed7d7;
            border: 1px solid #feb2b2;
            color: #c53030;
        }

        .alert-success {
            background-color: #c6f6d5;
            border: 1px solid #9ae6b4;
            color: #2f855a;
        }

        .alert-info {
            background-color: #bee3f8;
            border: 1px solid #90cdf4;
            color: #2b6cb0;
        }

        /* Back to Home */
        .back-home {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: white;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            transition: opacity 0.2s ease;
        }

        .back-home:hover {
            opacity: 0.8;
        }

        .back-home::before {
            content: '←';
            margin-right: 0.5rem;
            font-size: 1.2rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                padding: 1rem 0.5rem;
            }

            .login-container {
                max-width: 100%;
            }

            .login-header,
            .login-content {
                padding: 1.5rem;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }

            .back-home {
                position: static;
                margin-bottom: 1rem;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .login-header,
            .login-content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

                <span>or sign in with email</span>

            <!-- Login Form -->
            <form class="login-form" method="POST" action="/login" id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                    <div class="error-message" id="email-error"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <div class="error-message" id="password-error"></div>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="/password/reset" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="submit-button" id="submitBtn">
                    Sign In
                </button>
            </form>

            <!-- Register Link -->
            <div class="register-link">
                Don't have an account? <a href="/register">Create one here</a>
            </div>
        </div>
    </div>

    <!-- Simple JavaScript for form validation -->
    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');

        // Basic form validation
        function validateForm() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            submitBtn.disabled = !(email && password);
        }

        // Add event listeners
        emailInput.addEventListener('input', validateForm);
        passwordInput.addEventListener('input', validateForm);

        // Initial validation
        validateForm();

        // Handle form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Basic validation
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                return;
            }

            // In a real application, this would submit to the server
            console.log('Form submitted:', { email, password });

            // For demo purposes, show loading state
            submitBtn.textContent = 'Signing In...';
            submitBtn.disabled = true;

            setTimeout(() => {
                submitBtn.textContent = 'Sign In';
                submitBtn.disabled = false;
            }, 2000);
        });
    </script>
