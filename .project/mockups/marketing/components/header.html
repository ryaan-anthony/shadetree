<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Component - Shadetree</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!-- Header Navigation -->
    <header class="bg-white shadow-lg border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <!-- Logo -->
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <h1 class="text-2xl font-bold text-gray-900">
                            <span class="text-green-600">Shade</span>tree
                        </h1>
                    </div>
                </div>

                <!-- Desktop Navigation -->
                <nav class="hidden md:flex space-x-8">
                    <a href="#" class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors">Features</a>
                    <a href="#" class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors">Pricing</a>
                    <a href="#" class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors">About</a>
                    <a href="#" class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors">Contact</a>
                </nav>

                <!-- CTA and Auth Buttons -->
                <div class="hidden md:flex items-center space-x-4">
                    <a href="#" class="text-gray-700 hover:text-green-600 px-3 py-2 text-sm font-medium transition-colors">Sign In</a>
                    <a href="#" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
                        Start Free Trial
                    </a>
                </div>

                <!-- Mobile menu button -->
                <div class="md:hidden">
                    <button type="button" class="text-gray-700 hover:text-green-600 focus:outline-none focus:text-green-600" id="mobile-menu-button">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation Menu -->
        <div class="md:hidden hidden" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-gray-50">
                <a href="#" class="text-gray-700 hover:text-green-600 block px-3 py-2 text-base font-medium">Features</a>
                <a href="#" class="text-gray-700 hover:text-green-600 block px-3 py-2 text-base font-medium">Pricing</a>
                <a href="#" class="text-gray-700 hover:text-green-600 block px-3 py-2 text-base font-medium">About</a>
                <a href="#" class="text-gray-700 hover:text-green-600 block px-3 py-2 text-base font-medium">Contact</a>
                <div class="border-t border-gray-200 pt-4 pb-3">
                    <a href="#" class="text-gray-700 hover:text-green-600 block px-3 py-2 text-base font-medium">Sign In</a>
                    <a href="#" class="bg-green-600 hover:bg-green-700 text-white block px-3 py-2 rounded-lg text-base font-medium mt-2 mx-3">
                        Start Free Trial
                    </a>
                </div>
            </div>
        </div>
    </header>

    <script>
        // Mobile menu toggle
        document.getElementById('mobile-menu-button').addEventListener('click', function() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
