# Starter services offered to a business for its industry (CAT-05). Loaded into the
# industry_presets table by db/seeds.rb (missing industries only) and by
#   bin/rails presets:sync            # add industries that aren't in the database yet
#   bin/rails presets:sync OVERWRITE=1  # replace every preset with this file
# Operators can also edit presets in the database without a deploy (see presets:export).
#
# Each item: name (required), description, unit (each, hour, visit, sq_ft, linear_ft or
# custom with custom_unit), taxable (default true), duration_minutes, category.
# No prices: owners fill in their own (03-catalog, open question 2).

cleaning:
  default_visit_minutes: 150
  items:
    - { name: Standard clean, unit: visit, duration_minutes: 150, category: Cleaning,
        description: "Kitchen, bathrooms, dusting, vacuuming and mopping throughout." }
    - { name: Deep clean, unit: visit, duration_minutes: 300, category: Cleaning,
        description: "Everything in a standard clean plus baseboards, inside appliances and detailed scrubbing." }
    - { name: Move-in / move-out clean, unit: visit, duration_minutes: 360, category: Cleaning,
        description: "Empty-home clean including inside cabinets, closets and appliances." }
    - { name: Inside oven, unit: each, duration_minutes: 45, category: Add-ons }
    - { name: Inside fridge, unit: each, duration_minutes: 30, category: Add-ons }
    - { name: Interior windows, unit: each, duration_minutes: 10, category: Add-ons }
    - { name: Laundry, unit: custom, custom_unit: load, duration_minutes: 60, category: Add-ons }

